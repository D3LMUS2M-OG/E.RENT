project_id = "e-rent"

[api]
schemas = ["public", "graphql_public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_geography.sql"]

[auth]
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Role claims in the JWT (ADR-002 / ADR-010)
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Phone and Google are built but off at launch (ADR-007). Enable later from config.
[auth.sms]
enable_signup = false
